# SOURCE: zurp-astronomics-site — trial (ticket #101): the CI's steps under timeouts, to tell a hang from a queue
# AUTHOR: engineer
# DATE: 2026-10-12
# STATUS: temporary — removed before delivery
name: trial full suite
on: workflow_dispatch
jobs:
  full:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: suite
        run: |
          set -o pipefail
          date; timeout 300 npm ci 2>&1 | tail -3
          date; ZURP_CATALOG=simulator timeout 600 npm run build 2>&1 | grep -v '▶\|└─\|├─' | tail -15
          date; timeout 120 node scripts/check-dist.mjs 2>&1 | tail -4
          date; timeout 120 npm run readme-kit 2>&1 | tail -1
          date; timeout 300 npm test 2>&1 | grep -E '^(not )?ok|^# (pass|fail)'
          date
