name: Trial 115 signature
on: workflow_dispatch
jobs:
  sig:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund > /dev/null
      - run: |
          cat > /tmp/sig.mjs <<'JS'
          import sharp from 'sharp';
          import { writeFileSync } from 'node:fs';
          import { siteContent } from './src/lib/content.mjs';
          import { signaturePng, signatureTexts } from './src/lib/signature-image.mjs';
          const png = await signaturePng(signatureTexts(siteContent()));
          console.log('signature', png.length, JSON.stringify(await sharp(png).metadata(), ['width', 'height', 'channels', 'hasAlpha']));
          const plate = await sharp('src/assets/header/zurp-astronomics-plate.webp').resize(800).webp({ quality: 80 }).toBuffer();
          console.log('plate', plate.length, JSON.stringify(await sharp(plate).metadata(), ['width', 'height']));
          writeFileSync('/tmp/sig.png', png);
          JS
          cp /tmp/sig.mjs ./sig-trial.mjs && node ./sig-trial.mjs
          cat > ./ascii-trial.mjs <<'JS'
          import sharp from 'sharp';
          const ramp = ' .:-=+*#%@';
          async function show(input, cols, rows, region) {
            let img = sharp(input);
            if (region) img = img.extract(region);
            const { data } = await img.resize(cols, rows, { fit: 'fill' }).greyscale().raw().toBuffer({ resolveWithObject: true });
            for (let y = 0; y < rows; y++) {
              let line = '';
              for (let x = 0; x < cols; x++) line += ramp[Math.min(9, Math.floor(data[y * cols + x] / 25.6))];
              console.log('|' + line + '|');
            }
          }
          await show('/tmp/sig.png', 160, 20);
          console.log('--- left half, zoomed');
          await show('/tmp/sig.png', 200, 30, { left: 0, top: 0, width: 400, height: 114 });
          console.log('--- right half, zoomed');
          await show('/tmp/sig.png', 200, 30, { left: 400, top: 0, width: 400, height: 114 });
          JS
          node ./ascii-trial.mjs
