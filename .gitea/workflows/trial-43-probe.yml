# SOURCE: zurp-astronomics-site — ticket #43 trial: the relevance probe's job, as is, with fixed inputs
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: trial (removed before delivery)
name: trial-43-probe

on: workflow_dispatch

jobs:
  relevance:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    # ⚠ LE PLAFOND PROTÈGE TON PROJET, PAS LA FLOTTE. La sonde joue TA suite, deux fois. Une suite
    # qui ne termine jamais — boucle, attente réseau, prompt — ferait tourner ce job indéfiniment
    # sur TON runner : le rail, lui, abandonne son attente au bout de deux minutes et n'a aucun
    # moyen d'arrêter ce qui tourne ici.
    #
    # 15 min couvre deux exécutions d'une suite ordinaire avec une marge large. Si ta suite en
    # demande plus, monte ce chiffre dans le même geste que l'image du job.
    timeout-minutes: 15
    # `alpine` n'a pas bash. Tout ce qui suit est POSIX.
    defaults:
      run:
        shell: sh
    steps:
      # Pas d'`actions/checkout` : l'action est du node, que l'image du job ne porte pas. On pose
      # `git` et on clone à la main — sortie n°1 de la note de `ci.yml`, celle qui coûte une ligne.
      - name: Outils
        run: apk add --no-cache git >/dev/null 2>&1 || true

      # Le Node de `ci.yml` (job `build`) et de `.github/workflows/deploy.yml` : Node 24 LTS, quel
      # que soit celui de l'image. Sans lui, la suite (Astro 7, `engines` >= 24) jouerait ici sur
      # le node de l'image et rendrait `inapplicable` sans rapport avec la livraison. `setup-node`
      # préfixe le PATH des étapes suivantes ; `run_suite` transmet ce PATH à la suite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sonder
        # Une affectation par entrée, et c'est la SEULE place où une expression d'entrée apparaît :
        # le runner pose la valeur dans l'environnement, le shell la lit comme une donnée.
        env:
          FORGE_TOKEN: ${{ github.token }}
          PROBE_HARNESS: "scripts/check-dist.mjs scripts/readme-kit.mjs"
          PROBE_BASE_SHA: "cc8939c45559dd41e100768b5ece3dc3a7c57304"
          PROBE_HEAD_SHA: ${{ github.sha }}
          PROBE_TEST_CMD: "npm ci && npm run build && node scripts/check-dist.mjs && npm run readme-kit:check"
        run: |
          # PAS de `set -e` ici, et c'est délibéré : ce script FAIT ÉCHOUER des commandes exprès —
          # l'échec de la suite EST la mesure. Un `set -e` avorterait au moment précis où le fait
          # apparaît, et la sonde rendrait une panne à la place de son résultat.
          #
          # ⚠ `set -f` : GLOB DÉSACTIVÉE POUR TOUT LE SCRIPT. `$harness` est délibérément NON quoté
          # là où il est développé — c'est ainsi qu'on obtient plusieurs chemins — mais sans `-f`,
          # le shell y applique AUSSI l'expansion de motifs : un projet déclarant `*.test` verrait
          # la sonde travailler sur ce que le répertoire courant contient au moment du run, pas sur
          # ce qu'il a déclaré. `-f` garde la découpe par espaces et supprime la devinette.
          set -f

          fact() { echo "LCARS-PROBE $*"; }
          harness="$PROBE_HARNESS"
          base="$PROBE_BASE_SHA"
          head="$PROBE_HEAD_SHA"

          fact "probe=test-relevance base=${base} head=${head}"

          # ── Cas inapplicables, DITS et non devinés (un vert par défaut serait le mensonge) ──
          if [ -z "$harness" ]; then
            fact "verdict=inapplicable reason=no-harness-declared"
            echo "Ce projet ne déclare aucun chemin de preuve (section '## Harness' de son CLAUDE.md)."
            echo "La sonde ne devine pas quels fichiers sont du code et lesquels sont de la preuve :"
            echo "se tromper ici accuserait une livraison à tort."
            exit 0
          fi

          # ⚠ UNE COMMANDE DE TEST VIDE FABRIQUERAIT UN `blind` DE TOUTES PIÈCES. `( )` est une
          # sous-shell valide en POSIX et sort en 0 : le témoin passerait, la mesure passerait, et
          # la sonde annoncerait « la suite reste verte sans le code livré » à un projet qui n'a
          # aucune suite. C'est le seul mensonge que cette sonde pouvait produire.
          if [ -z "$PROBE_TEST_CMD" ]; then
            fact "verdict=inapplicable reason=no-test-cmd"
            echo "Ce projet ne déclare aucune commande de test (section '## Test' de son CLAUDE.md)."
            exit 0
          fi

          # ── LA COMMANDE EST UN SCRIPT, ET ELLE S'EXÉCUTE COMME TEL ──
          #
          # Elle était substituée EN LIGNE dans `( … )`. Sur un `## Test` de plusieurs lignes, ça
          # donnait deux commandes dans un sous-shell dont le code de retour est celui de la
          # DERNIÈRE : `make build` pouvait échouer et le témoin rester vert. Mesuré le 2026-08-20.
          #
          # Écrite dans un fichier et jouée par `sh -e`, elle a la sémantique de la CI — première
          # erreur, arrêt — et le contrat du template exige justement que `## Test` et `ci.yml`
          # portent la MÊME commande.
          #
          # ⚠ ELLE EST ÉCRITE DEPUIS LA VARIABLE, PLUS COLLÉE DANS UN HEREDOC. Avant, l'expression
          # d'entrée `inputs.test_cmd` était substituée DANS le corps d'un heredoc à délimiteur
          # quoté : rien n'était ré-interprété à l'écriture, mais la substitution avait lieu dans le
          # texte du script, avant le shell — c'est l'interpolation que le rail refuse. `printf '%s\n'`
          # écrit la valeur de `$PROBE_TEST_CMD` telle quelle, octet pour octet : guillemets, `$(…)`,
          # retours à la ligne restent du texte jusqu'à ce que `sh -e` joue le fichier.
          #
          # La SENTINELLE reste en dernière ligne : `:` est le no-op POSIX, elle ne change ni la
          # sémantique ni le code de sortie (sous `sh -e`, un échec antérieur a déjà arrêté le
          # script ; si tout passe, `:` rend 0 comme la dernière commande l'aurait fait).
          cmd_file="$(pwd)/.lcars-probe-cmd.sh"
          {
            printf '%s\n' "$PROBE_TEST_CMD"
            printf '%s\n' ": LCARS_PROBE_CMD_COMPLETE"
          } > "$cmd_file"

          # ⚠ CE QUE CETTE VÉRIFICATION GARDAIT A DISPARU, ET ELLE CHANGE DONC DE RÔLE. Elle
          # détectait un `## Test` contenant une ligne ÉGALE au délimiteur du heredoc, qui fermait
          # celui-ci en cours de route (transcription partielle, reste de la commande joué dans CE
          # shell). Sans heredoc, plus de délimiteur, plus de collision possible. On la garde pour le
          # seul cas qui reste : une écriture du fichier qui échoue ou s'arrête avant la fin (disque
          # plein, répertoire non inscriptible). Mesurer une fraction de la commande rendrait un
          # verdict sur une AUTRE commande — la raison de verdict ne change pas, sa cause si.
          if [ "$(tail -n 1 "$cmd_file" 2>/dev/null)" != ": LCARS_PROBE_CMD_COMPLETE" ]; then
            fact "verdict=inapplicable reason=test-cmd-untranscribable"
            echo "La commande de test n'a pas pu être écrite intégralement dans le fichier de la"
            echo "sonde ($cmd_file) : la sentinelle de fin manque."
            echo "Mesurer la fraction transcrite rendrait un verdict sur une AUTRE commande."
            exit 0
          fi

          # ── LA RÉCUPÉRATION VIT ICI, ET PLUS DANS UNE ÉTAPE À PART ──
          #
          # Elle avait son propre step avec `set -e`. Un `fetch` en échec y avortait le step, Gitea
          # SAUTAIT « Sonder », et le run entier rendait rouge SANS ÉMETTRE LE MOINDRE FAIT : le
          # rail lisait des logs vides et le juge recevait un appel réussi sans verdict. Le
          # commentaire de fin promettait « TOUJOURS 0 » alors que le JOB, lui, pouvait échouer.
          #
          # Le cas n'est pas théorique : `git fetch <sha>` exige que le serveur autorise
          # `uploadpack.allowReachableSHA1InWant`, ce qui n'est pas le défaut partout. Une
          # configuration de forge devenait un run rouge muet.
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          # Le jeton ne s'injecte que dans une URL qui sait le porter. Un `file://` ou un `ssh://`
          # recevant un `user:pass@` devient une URL invalide — et surtout, y coller un secret
          # n'aurait aucun sens.
          case "$url" in
            http://*|https://*)
              auth=$(printf '%s' "$url" | sed "s#://#://x-access-token:${FORGE_TOKEN}@#") ;;
            *)
              auth="$url" ;;
          esac

          git init -q repo || { fact "verdict=inapplicable reason=git-unavailable"; exit 0; }
          cd repo
          git remote add origin "$auth"

          # ⚠ `2>/dev/null` SUR LES DEUX : l'URL porte le jeton, et git le recrache dans ses
          # messages d'erreur. Un `fetch` en échec écrirait le jeton dans les logs du job, que la
          # forge sert à qui peut lire le dépôt.
          if ! git fetch -q --depth=1 origin "$base" 2>/dev/null ||
             ! git fetch -q --depth=1 origin "$head" 2>/dev/null; then
            fact "verdict=inapplicable reason=fetch-failed"
            echo "Impossible de récupérer les deux états depuis la forge. Cause la plus fréquente :"
            echo "le serveur n'autorise pas de demander un SHA non annoncé"
            echo "(git config uploadpack.allowReachableSHA1InWant=true côté forge)."
            exit 0
          fi

          # ═══ LE JETON SORT D'ICI, ET IL EN SORT AVANT QUE LE MOINDRE CODE DU LIVRABLE TOURNE ═══
          #
          # Deux vecteurs, et le premier était le pire parce qu'il était sur DISQUE :
          #
          #   1. `git remote add origin "$auth"` écrit l'URL — jeton compris, en clair — dans
          #      `repo/.git/config`. Or la commande de test tourne dans CE répertoire, et elle vient
          #      du `CLAUDE.md` de la TÊTE JUGÉE. Un `cat .git/config` suffisait ;
          #   2. `FORGE_TOKEN` est dans l'environnement de ce shell, donc hérité par tout enfant.
          #
          # ⚠ « PAS DE PRIVILÈGE NOUVEAU » N'EST PAS UNE RAISON DE LAISSER LE GESTE. Qui contrôle
          # `tests/run.sh` exécute déjà du code arbitraire dans ce job — c'est vrai, et ça justifie
          # de ne pas paniquer, pas de laisser un secret écrit à côté du code qu'on juge. Ça coûte
          # deux lignes.
          #
          # La sonde n'a plus besoin du réseau : tout ce qui suit est du `checkout` LOCAL. On coupe
          # donc les deux vecteurs ici, à l'endroit exact où le besoin s'arrête.
          git remote remove origin
          unset FORGE_TOKEN

          # ── ET LA SUITE JUGÉE NE VOIT PLUS RIEN DU TOUT : LISTE BLANCHE, PAS LISTE NOIRE ──
          #
          # Le runner injecte ses propres secrets dans l'environnement du job — `ACTIONS_RUNTIME_TOKEN`
          # pour le cache et les artefacts, et ce que l'opérateur y a mis. La commande de test vient
          # du `CLAUDE.md` de la TÊTE JUGÉE : elle appartient au livrable qu'on évalue, et elle n'a
          # besoin d'AUCUN d'eux pour jouer une suite.
          #
          # ⚠ CE FILTRE ÉTAIT UN MOTIF SUR LES NOMS, ET C'ÉTAIT LA MAUVAISE FORME. `…(TOKEN|SECRET|
          # PASSWORD)$` laissait passer `AWS_SECRET_ACCESS_KEY` (finit par `_KEY`), `DEPLOY_KEY`,
          # `SSH_PRIVATE_KEY`, `DATABASE_URL` (mot de passe dans l'URL), `KUBECONFIG`,
          # `GCP_SERVICE_ACCOUNT_JSON`, `VAULT_ROLE_ID`. Mesuré le 2026-08-20. Élargir le motif
          # n'aurait déplacé la frontière que jusqu'au prochain nom : une liste noire est fausse par
          # construction, puisqu'elle doit connaître à l'avance ce qu'elle n'a jamais vu.
          #
          # `env -i` renverse la charge : la suite reçoit CE QU'ON LUI DONNE, et rien d'autre. La
          # liste ci-dessous est complète par construction — ce qui n'y figure pas n'existe pas pour
          # elle, aujourd'hui comme pour le secret ajouté demain.
          #
          # `HOME` pointe sur un répertoire VIERGE, et ce n'est pas un détail : le vrai `HOME` porte
          # `.netrc`, `.git-credentials`, `.aws/credentials`, `.docker/config.json` — des secrets sur
          # DISQUE, qu'aucun filtre d'environnement n'atteint jamais. Un `HOME` neuf les ferme tous
          # d'un geste, et il reste inscriptible pour les outils qui y écrivent leur cache.
          #
          # ⚠ CE QUE ÇA COÛTE, ET POURQUOI ON LE PAIE : une suite qui a BESOIN d'un secret ou d'un
          # cache dans `$HOME` devient rouge au TÉMOIN, et la sonde rend `inapplicable`. C'est le
          # sens voulu. Une suite qui pousse vers un registre ou tape un service authentifié serait
          # jouée DEUX FOIS par cette sonde, avec les effets de bord en double ; et sa mesure ne
          # dirait de toute façon rien sur sa capacité à voir un code manquant. Refuser de la mesurer
          # est le résultat juste — à condition de le DIRE, ce que fait le texte de `head-suite-red`.
          probe_home="$(pwd)/.lcars-probe-home"
          rm -rf "$probe_home" && mkdir -p "$probe_home"

          # Jouée deux fois, à l'identique. Une seule définition, sinon les deux exécutions dérivent
          # et la comparaison ne compare plus rien.
          run_suite() {
            env -i \
              PATH="$PATH" \
              HOME="$probe_home" \
              TMPDIR="${TMPDIR:-/tmp}" \
              TERM="${TERM:-dumb}" \
              LANG="${LANG:-C}" \
              LC_ALL="${LC_ALL:-C}" \
              CI=true \
              LCARS_PROBE=1 \
              sh -e "$cmd_file"
          }

          # ⚠ CE QUI RESTE HORS DE CE FICHIER, et qu'un opérateur doit poser : l'EGRESS. Après ce
          # point la sonde ne parle plus à rien ; un job sans réseau sortant fermerait la dernière
          # porte, et il la fermerait aussi pour `tests/run.sh`. Ça se déclare sur le runner ou sur
          # l'image, pas ici — et tant que ce n'est pas posé, un secret que l'opérateur a mis dans
          # l'environnement du job reste lisible par tout ce que le job lance HORS de `run_suite`.

          git checkout -q "$head" 2>/dev/null || {
            fact "verdict=inapplicable reason=head-unreachable"
            exit 0
          }

          missing=""
          for p in $harness; do
            [ -e "$p" ] || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            fact "verdict=inapplicable reason=harness-absent paths=$(echo $missing | tr ' ' ',')"
            echo "Chemins déclarés absents de la tête livrée :$missing"
            exit 0
          fi

          # ── 1. TÉMOIN — la suite doit être verte AVANT qu'on touche à quoi que ce soit ──
          echo "===== TÉMOIN : la suite sur la tête livrée ====="
          run_suite ; witness=$?
          fact "witness_exit=${witness} env=minimal"

          if [ "$witness" -ne 0 ]; then
            fact "verdict=inapplicable reason=head-suite-red"
            echo "La suite est rouge sur la tête livrée. Son rouge sur le code de base ne"
            echo "prouverait rien : on mesurerait une panne, pas une couverture."
            echo
            echo "⚠ LIRE CE ROUGE AVEC SA CONDITION : la sonde joue la suite dans un environnement"
            echo "MINIMAL — aucun secret, aucune variable de l'opérateur, HOME vierge. Une suite qui"
            echo "a besoin d'un jeton ou d'un cache est rouge ICI sans l'être dans la CI. Ce fait"
            echo "porte sur la mesurabilité de la suite, PAS sur la livraison."
            exit 0
          fi

          # ── 2. MESURE — arbre de BASE, puis le harnais rapatrié de la tête ──
          # `checkout base` d'abord : l'arbre devient EXACTEMENT l'état de base, donc un fichier
          # ajouté par la livraison hors du harnais DISPARAÎT. C'est le but — s'il restait, la suite
          # le trouverait et le vert ne voudrait rien dire.
          git checkout -q "$base" || {
            fact "verdict=inapplicable reason=base-unreachable"
            exit 0
          }
          git checkout -q "$head" -- $harness || {
            fact "verdict=inapplicable reason=harness-not-restorable"
            exit 0
          }

          echo "===== MESURE : code de base + harnais de la tête ====="
          run_suite ; reverted=$?
          fact "reverted_exit=${reverted}"

          if [ "$reverted" -ne 0 ]; then
            fact "verdict=relevant harness=$(echo $harness | tr ' ' ',')"
            echo "La suite S'APERÇOIT de l'absence du code livré. Elle le prouve."
          else
            fact "verdict=blind harness=$(echo $harness | tr ' ' ',')"
            echo "La suite reste VERTE sans le code livré : elle ne le prouve pas."
            echo "Ce n'est pas un verdict sur la livraison — c'est un fait sur la suite."
          fi

          # ⚠ TOUJOURS 0, ET C'EST LA PARTIE CONTRE-INTUITIVE.
          #
          # Deux raisons, et la seconde est la vraie. (1) Un run rouge serait indiscernable d'un
          # runner cassé, d'une image sans python, d'un réseau coupé — le fait le plus utile de cette
          # sonde deviendrait le plus ambigu. (2) Sortir en échec quand la suite est aveugle serait
          # DÉCIDER : la sonde rapporte, le juge tranche. Une sonde qui bloque a cessé d'être un
          # gain pour devenir une précondition, et le jour où elle se trompe elle arrête la flotte.
          #
          # ⚠ ET LA PROMESSE PORTE MAINTENANT SUR LE JOB, PAS SEULEMENT SUR CE STEP. Elle ne le
          # faisait pas : la récupération vivait dans un step à part sous `set -e`, donc un `fetch`
          # en échec avortait AVANT ce script, Gitea sautait ce step, et le run rendait rouge sans
          # émettre le moindre fait. Un opérateur lisant ce paragraphe devant un run rouge en
          # déduisait un bug de runner. La récupération est descendue ici, et son échec est
          # maintenant un `verdict=inapplicable` comme les autres.
          #
          # ⚠ SAUF UN CAS, ET IL FAUT LE CONNAÎTRE : `timeout-minutes` TUE LE JOB. Le script
          # n'atteint alors jamais cette ligne, le job rend rouge, et les logs portent le
          # `probe=test-relevance` du début SANS `verdict=`. C'est le seul run rouge légitime de
          # cette sonde, et il se reconnaît à ça — des faits ouverts, pas de verdict. Un rail qui
          # verrait un run rouge sans verdict lit un DÉPASSEMENT DE PLAFOND, pas un runner cassé.
          #
          # Le fait vit dans les lignes `LCARS-PROBE`, que le rail lit dans les logs du JOB.
          exit 0
