# SOURCE: zurp-astronomics-site — ticket #43 trial: read Astro 7's image pipeline from the installed package
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: trial (removed before delivery)
name: trial-43-upgrade

on: workflow_dispatch

jobs:
  notes:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Notes
        run: |
          npm ci --no-audit --no-fund >/dev/null 2>&1
          ls -d node_modules/lightningcss node_modules/postcss 2>&1 || true
          cd node_modules/astro/dist/assets
          find . -name '*.js' | sort
          echo "REPORT-B64-BEGIN"
          tar -cf - $(find . -name '*.js') ../../package.json ../../dist/types/public/config.d.ts | gzip -9n | base64 -w0; echo
          echo "REPORT-B64-END"
