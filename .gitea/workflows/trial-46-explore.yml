# SOURCE: zurp-astronomics-site — trial #46: read Astro 7 content-layer internals (temporary, removed before delivery)
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: trial
name: trial-46-explore

on: workflow_dispatch

jobs:
  explore:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Explore
        run: |
          set +e
          exec 3>&1 >/tmp/x.txt 2>&1
          npm ci --no-audit --no-fund >/dev/null 2>&1
          A=node_modules/astro
          echo "=== exports"; node -e "const p=require('./$A/package.json');console.log(Object.keys(p.exports).join(' '))"
          echo "=== zod in astro:content?"; grep -n "export" $A/dist/content/runtime.js | head -20
          grep -rn "zod" $A/types/content.d.ts 2>/dev/null | head; ls $A/types 2>/dev/null
          echo "=== content.d.ts module decl"; grep -n "z\b\|export {" $A/client.d.ts | head -20
          echo "=== templates/content/types.d.ts head"; sed -n 1,60p $A/templates/content/types.d.ts 2>/dev/null
          echo "=== imageSrcToImportId"; grep -rn "function imageSrcToImportId" -A16 $A/dist | head -40
          echo "=== addAssetImports"; grep -rn "addAssetImports" -A14 $A/dist/content/mutable-data-store.js | head -50
          echo "=== IMAGE in utils"; grep -n "IMAGE_IMPORT_PREFIX\|image: ()" -B2 -A8 $A/dist/content/utils.js | head -80
          echo "=== content-assets plugin resolve"; grep -rn "CONTENT_IMAGE_FLAG" $A/dist --include=*.js -l
          for f in $(grep -rln "CONTENT_IMAGE_FLAG" $A/dist --include=*.js); do echo "--- $f"; grep -n "CONTENT_IMAGE_FLAG" -A12 $f | head -50; done
          echo "=== assets plugin load"; grep -n "fsPath\|getProxyCode\|referencedImages" $A/dist/assets/vite-plugin-assets.js | head -40
          echo "=== loader types"; sed -n 1,80p $A/dist/content/loaders/types.d.ts
          echo "=== LoaderContext"; grep -rn "interface LoaderContext" -A40 $A/dist/content/loaders/types.d.ts | head -60
          echo "=== config"; ls $A/dist/content/; grep -n "content.config\|CONTENT_CONFIG" $A/dist/content/utils.js | head
          echo "=== schema image type"; grep -rn "SchemaContext" -A8 $A/dist/content/*.d.ts | head -30
          echo "=== astro/zod"; ls $A/zod* 2>/dev/null; node -e "import('astro/zod').then(m=>console.log(Object.keys(m).slice(0,10)))"
          echo "=== astro:content d.ts"; grep -rn "declare module 'astro:content'" -A40 $A/*.d.ts $A/types/*.d.ts 2>/dev/null | head -60
          echo "=== runtime-assets"; cat $A/dist/content/runtime-assets.js
          echo "=== content-assets plugin"; cat $A/dist/content/vite-plugin-content-assets.js | head -150
          echo "=== assets plugin"; grep -n "load(" -A40 $A/dist/assets/vite-plugin-assets.js | head -120
          echo "=== GITHUB env"; env | grep -E '^(GITHUB|GITEA|CI|RUNNER)_?' | grep -v TOKEN | sort
          exec 1>&3
          echo "B64-BEGIN"; gzip -9n < /tmp/x.txt | base64 -w0; echo; echo "B64-END"
          exit 0
