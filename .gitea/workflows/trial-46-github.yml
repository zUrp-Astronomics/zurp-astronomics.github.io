# SOURCE: zurp-astronomics-site — trial #46: build with the catalog read on the real GitHub (no token, few requests); diagnose compare-dist's CSS check (temporary, removed before delivery)
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: trial
name: trial-46-github

on: workflow_dispatch

jobs:
  github:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build on GitHub (unauthenticated)
        run: |
          npm ci --no-audit --no-fund >/dev/null 2>&1
          rc=0
          ZURP_CATALOG=github npm run build > /tmp/gh-build.log 2>&1 || rc=$?
          echo "build exit: $rc"
          grep -n -i -E 'catalog|problem|missing|error|HTTP|rate' /tmp/gh-build.log | head -40
          tail -5 /tmp/gh-build.log
          if [ "$rc" = 0 ]; then
            node scripts/check-dist.mjs | tail -4
            npm run readme-kit | tail -2
            sed -n '/### Work/,/### Released/p' .zurp-catalog/readme-kit/profile/README.md | grep -o '<b><a [^>]*>[^<]*' | sed 's/.*>//'
            cat .zurp-catalog/remote.json | head -40
          fi
          curl -s https://api.github.com/rate_limit | grep -A4 '"core"' | head -6
      - name: compare-dist CSS diagnosis (simulator build)
        run: |
          rm -rf dist
          ZURP_CATALOG=simulator npm run build > /tmp/sim.log 2>&1 || { tail -30 /tmp/sim.log; exit 1; }
          node --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            const l = await import("lightningcss");
            const T = { chrome: 111 << 16, edge: 111 << 16, firefox: 114 << 16, safari: (16 << 16) | (4 << 8) };
            for (const f of readdirSync("dist/_astro").filter((f) => f.endsWith(".css"))) {
              const code = readFileSync("dist/_astro/" + f);
              const warnings = [];
              const out = l.transform({ filename: f, code, minify: true, targets: T, errorRecovery: true });
              console.log(f, "in", code.length, "out", out.code.length, "warnings", out.warnings.length, out.warnings.slice(0, 3).map((w) => w.message).join(" | "));
              console.log("  head:", out.code.toString().slice(0, 160));
            }
          '
