# SOURCE: zurp-astronomics-site — throwaway trial of ticket #61: trial-compare-dist, with every comparison printed (none stops the job), report last
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: throwaway — removed before delivery

name: trial-61-unicorn

on: workflow_dispatch

jobs:
  compare:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 30
    env:
      BASE_REF: main
      # ADMITTED DIFFERENCES — none (ticket #61 adds no served file and does not change the README kit;
      # the lists of #53 are in main since). Each list is space-separated; empty = nothing admitted.
      DIST_ADMITTED_NEW: ''
      KIT_MAY_DIFFER: ''
    steps:
      - uses: actions/checkout@v4

      - name: Base checkout
        run: |
          git fetch -q --no-tags --depth=1 origin "$BASE_REF"
          git worktree add -q /tmp/base FETCH_HEAD
          echo "base $(git -C /tmp/base rev-parse --short HEAD), head $(git rev-parse --short HEAD)"
          # The base builds with the Node its own deploy workflow names.
          v=$(sed -n 's/^ *node-version: *\([0-9][0-9.]*\).*/\1/p' /tmp/base/.github/workflows/deploy.yml | head -1)
          echo "BASE_NODE=${v:-20}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BASE_NODE }}

      - name: Build base
        working-directory: /tmp/base
        run: |
          node -v
          npm ci --no-audit --no-fund >/dev/null
          # Its stamp reads its own commit (GITHUB_SHA would be the head's). Its catalog is read on the
          # simulator, like the head's: since #46 a build without a named source fails.
          env -u GITHUB_SHA ZURP_CATALOG=simulator npm run build > /tmp/base-build.log 2>&1 || { tail -60 /tmp/base-build.log; exit 1; }
          tail -3 /tmp/base-build.log
          npm run readme-kit

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build head (the CI commands)
        run: |
          node -v
          npm ci --no-audit --no-fund
          npm ls astro sharp esbuild vite js-yaml mustache markdown-it
          ZURP_CATALOG=simulator npm run build > /tmp/head-build.log 2>&1 || { tail -80 /tmp/head-build.log; exit 1; }
          echo "--- build warnings / errors"
          grep -n -i -E 'warn|error|deprecat|fail' /tmp/head-build.log | head -60 || true
          tail -3 /tmp/head-build.log
          node scripts/check-dist.mjs > /tmp/check-dist.log 2>&1 || { cat /tmp/check-dist.log; exit 1; }
          tail -2 /tmp/check-dist.log
          npm run readme-kit
          npm test
          cat /tmp/check-dist.log | tail -40

      - name: Compare all
        run: |
          set -f
          diff -ru /tmp/base/.zurp-catalog/readme-kit .zurp-catalog/readme-kit && echo "KIT IDENTICAL" || echo "KIT DIFFERS"
          node scripts/compare-brand.mjs /tmp/base/dist dist > /tmp/brand-report.txt 2>&1 || true
          node scripts/compare-dist.mjs /tmp/base/dist dist > /tmp/report.txt 2>&1 || echo "compare-dist rc=$?"
          ls -l dist/_astro/ | grep -i unicorn || true; find dist -iname '*unicorn*' -exec ls -l {} \; ; find /tmp/base/dist -iname '*unicorn*' -exec ls -l {} \;
          echo "=== BRAND"; cat /tmp/brand-report.txt
          echo "=== DIST REPORT"; cat /tmp/report.txt
