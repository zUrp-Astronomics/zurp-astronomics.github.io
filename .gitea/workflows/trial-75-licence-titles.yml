# SOURCE: zurp-astronomics-site — throwaway trial of ticket #75: the OCL text of the real basilisk repository, for the simulator
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: temporary — removed before delivery
name: trial-75-licence-titles

on: workflow_dispatch

jobs:
  titles:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    steps:
      - name: The OCL text of basilisk
        run: |
          curl -sSfL --max-time 30 https://raw.githubusercontent.com/zUrp-Astronomics/basilisk/main/LICENSE -o /tmp/ocl
          curl -sSfL --max-time 30 https://api.github.com/repos/zUrp-Astronomics/basilisk/contents/ | grep -E '"(name|path)"' || true
          wc -c /tmp/ocl; sha256sum /tmp/ocl
          echo "B64-BEGIN"; gzip -9n < /tmp/ocl | base64 -w0; echo; echo "B64-END"
