# SOURCE: zurp-astronomics-site — throwaway trial of ticket #79: the site built from main and from this branch are identical; the suite passes
# AUTHOR: engineer
# DATE: 2026-10-10
# STATUS: throwaway — removed before delivery
name: trial-79-same-dist

on: workflow_dispatch

jobs:
  same-dist:
    runs-on: shell
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the branch (build stamp pinned)
        run: npm ci >/dev/null && GITHUB_SHA=0000000 ZURP_CATALOG=simulator npm run build >/dev/null && npm run readme-kit >/dev/null
      - name: Build main
        run: |
          git worktree add ../base origin/main
          cd ../base && npm ci >/dev/null && GITHUB_SHA=0000000 ZURP_CATALOG=simulator npm run build >/dev/null && npm run readme-kit >/dev/null
      - name: Compare dist/ and README kits
        run: |
          echo "files: main $(find ../base/dist -type f | wc -l), branch $(find dist -type f | wc -l)"
          # The build date (to the minute) is the one stamp left: blanked on both sides.
          for d in ../base/dist dist; do find $d -name '*.html' -exec sed -i -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}Z/DATE/g' {} +; done
          diff -r ../base/dist dist | head -60
          diff -rq ../base/dist dist && echo "DIST IDENTICAL"
          diff -r ../base/.zurp-catalog/readme-kit .zurp-catalog/readme-kit && echo "KIT IDENTICAL"
