# SOURCE: zurp-astronomics-site — synchronise the GitHub organisation README from the README kit
# AUTHOR: engineer
# DATE: 2026-10-03
# STATUS: active
#
# Synchronise le README de l'organisation : readme-kit/profile/README.md (généré depuis
# src/data/products.ts) remplace profile/README.md dans zUrp-Astronomics/.github, à chaque push qui
# touche le kit. Ce qui se recopiait à la main se recopie seul.
#
# ⚠ UN SEUL DÉPÔT EST ÉCRIT, ET CE N'EST PAS CELUI-CI. Ce dépôt-ci est publié par la fleet, qui exige
# que sa branche publiée reste un ancêtre de ce qu'elle publie : un commit poussé ici arrêterait la
# publication suivante. Le dépôt `.github` n'est publié par aucun projet : on peut y écrire.
#
# Jeton : README_SYNC_TOKEN, un fine-grained PAT de l'org, Contents en lecture-écriture sur le seul
# dépôt `.github`.
name: README de l'org

on:
  push:
    branches: [main]
    paths: ["readme-kit/profile/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-readme
  cancel-in-progress: false

jobs:
  org-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Kit (ce dépôt)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Dépôt de l'organisation
        uses: actions/checkout@v4
        with:
          repository: zUrp-Astronomics/.github
          token: ${{ secrets.README_SYNC_TOKEN }}
          path: org

      - name: README de l'org
        run: |
          mkdir -p org/profile
          cp site/readme-kit/profile/README.md org/profile/README.md

      - name: Commit si changé
        env:
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        working-directory: org
        run: |
          git add profile/README.md
          if git diff --cached --quiet; then echo "README de l'org déjà à jour"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "docs: README de l'org synchronisé depuis ${SOURCE}"
          git push -q
