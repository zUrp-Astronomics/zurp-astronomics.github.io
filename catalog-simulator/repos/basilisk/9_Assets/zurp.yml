name: Basilisk
tagline: >-
  Sleek but deadly Sony E adapter for astro cameras, bending glass to your will without leaving the
  warm room.
slogan: Bend the glass to your will
category: Adapter
section: gadgets          # mounts | cameras | gadgets | future
status: wip               # wip | future — devient « released » dès qu'une release existe sur GitHub
basedOn: Pinefeat

description:
  - >-
    Basilisk is a Sony E adapter for astro cameras: put a Sony E lens on your astro camera and drive
    it remotely. The glass bends to your will, and you never leave the warm room.
  - >-
    Based on the Pinefeat project, with the zUrp treatment. Open hardware like the rest of the
    catalog.

