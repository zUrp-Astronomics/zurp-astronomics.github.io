name: Maelstrom
tagline: APS-C cooled astronomical camera, with Nikon D40 CCD sensor.
slogan: Freeze the noise!
category: Camera
section: cameras          # mounts | cameras | gadgets | future
status: wip               # wip | future — devient « released » dès qu'une release existe sur GitHub
basedOn: Cam86 / Cam87

description:
  - >-
    Maelstrom is an APS-C cooled astronomical camera, built around the CCD sensor salvaged from a
    Nikon D40. Based on the Cam86/Cam87 projects, which pioneered the DSLR-sensor-reborn-as-astrocam
    approach.
  - >-
    Active TEC cooling with condensation control, 16-bit ADC path, INDI driver. The only way to get
    an APS-C CCD astrocam for under the price of a new CMOS — cannibalize a 2006 DSLR and do the
    electronics yourself.

poster: maelstrom.webp    # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Maelstrom poster on a worn, chipped cream plate: a steel mechanical sea dragon bristling with
  ice-blue crystal spikes, its eye glowing blue, bursts out of a churning wave in front of the full
  moon, ice-blue rays and blueprint sketches, above the slogan “Freeze the noise!”.
accent: '#04b8fd'         # couleur des rayons de l'affiche
