name: Wraith
tagline: >-
  An all-in-one mount controller on a Compute Module 5: mount control, imaging, plate solving and a
  web UI in one box.
slogan: Ghost in the sky
category: Controller
section: future           # mounts | cameras | gadgets | future
status: future            # wip | future | released — décidé par l'humain, jamais déduit d'une release

description:
  - >-
    Wraith is the future all-in-one controller: Raspberry Pi Compute Module 5 inside, full mount
    control stack + imaging pipeline + astrometry solver + web UI on one board.
  - >-
    Replaces the usual mount controller + mini PC combo with a single compact unit. Status: design
    phase — no public repo yet.

