name: Kaiju
tagline: Fully integrated harmonic alt-az mount for DSLR, like a SeeStar on steroids.
slogan: Over-engineered by principle
category: Mount
section: mounts           # mounts | cameras | gadgets | future
status: wip               # wip | future — devient « released » dès qu'une release existe sur GitHub

description:
  - >-
    Kaiju is a fully integrated harmonic alt-azimuth mount, designed for DSLR imaging with the ease
    of a SeeStar — but scaled up, printable, and hackable end-to-end.
  - >-
    Harmonic drives replace traditional worm gears: zero backlash, silent tracking, holding torque
    without gravity compensation tricks. Everything in one sealed head, no separate controller box
    to carry.

poster: kaiju.webp        # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Kaiju poster on a worn, chipped cream plate: a red-and-steel armoured mechanical kaiju with
  glowing red eyes roars in front of a pale full moon, one clawed hand thrust forward, between red
  rays and blueprint sketches of itself, above the slogan “Over-engineered by principle”.
accent: '#d81f15'         # couleur des rayons de l'affiche
