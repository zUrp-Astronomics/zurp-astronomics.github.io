name: Kraken
tagline: Compact but efficient powerbox, in a Raspberry Pi case.
slogan: Power to the people
category: Powerbox
section: gadgets          # mounts | cameras | gadgets | future
status: wip               # wip | future | released — décidé par l'humain, jamais déduit d'une release
basedOn: NAFAbox / Astralim

description:
  - >-
    Kraken is a compact powerbox the size of a Raspberry Pi case. Based on the NAFAbox and Astralim
    projects, with zUrp opinions on layout and bring-up sequencing.
  - >-
    Multiple 12V regulated outputs, PWM dew heaters, current monitoring, temperature/humidity
    sensors, all exposed over a simple protocol. Fits in the footprint of an RPi 4, plugs into your
    scope saddle.

poster: kraken.webp       # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Kraken poster on a worn, chipped cream plate: a teal-plated mechanical kraken with a golden eye
  coils its riveted tentacles, lined with steel suckers, out of crashing waves in front of the full
  moon, teal rays and blueprint sketches, above the slogan “Power to the people”.
accent: '#0d7268'         # couleur des rayons de l'affiche
