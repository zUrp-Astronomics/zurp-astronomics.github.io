# version (tag de la dernière release GitHub), le rang dans sa section.

name: Unicorn
tagline: Small but effective controller for astronomical mount, in a Tic-Tac box size.
slogan: Small but effective
category: Controller
section: gadgets          # mounts | cameras | gadgets | future
status: wip               # wip | future — devient « released » dès qu'une release existe sur GitHub
basedOn: TeenAstro

description:
  - >-
    Unicorn is a pocket-sized controller for astronomical mounts, fitting in a Tic-Tac box. Based on
    the TeenAstro project, adapted for minimal footprint and maximal portability.
  - >-
    Full-featured despite the size: dual-axis stepper control, ST4 autoguide, WiFi/Bluetooth,
    INDI/ASCOM compatible. A Tic-Tac box that outperforms most commercial hand controllers.

poster: unicorn.webp      # à côté de cette fiche — l'affiche série 2 (1254 × 1254)
posterAlt: >-
  Unicorn poster on a worn, chipped cream plate: a rearing mechanical unicorn with cream armour
  plates, brass gears, a spiralled violet horn, a glowing violet eye and a flowing
  magenta-and-violet mane, in front of the full moon, violet rays and a blueprint sketch of a horse
  head, above the slogan “Small but effective”.
accent: '#bd13ae'         # couleur des rayons de l'affiche
