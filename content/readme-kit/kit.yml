# SOURCE: zurp-astronomics-site — short texts of the README kit, shared by its templates (*.md of this folder)
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: active — read by scripts/readme-kit.mjs
# REVISED: 2026-10-06 (ticket #53) — `header`: the texts of the product README header, pasted once
# REVISED: 2026-10-06 (ticket #66) — no licence badge in the header any more (`header.licenceAlt` gone)
# REVISED: 2026-10-06 (ticket #75) — the two licence badges drawn by the site (`header.softwareAlt`,
#   `header.hardwareAlt`)

# The notice at the top of the files the deployment overwrites (the org README, the guide). Not the
# product headers: those are pasted once and never again (`header` below).
generated: >-
  generated by scripts/readme-kit.mjs (zurp-astronomics-site) at each deployment of the site, from
  its catalog — do not edit by hand: it is overwritten at the next deployment

# Alt text of the « Low-Tech & DIY » panel at the top of the org README.
panelAlt: >-
  Worn, creased “Low-Tech & DIY” panel: a riveted Nyan Cat trailing a pixel rainbow in front of a
  moon, on a blueprint with red rays.

# The README header of a product (product-header.md), pasted ONCE at the top of its repository's
# README and never again: it holds only URLs (poster, status badge, licence badges) whose content the
# site and shields.io keep up to date. No text of the product sheet here: it would go stale.
header:
  # The comments that open and close the block (they name no product): how to find it in a README.
  begin: zurp-readme-header:begin
  end: zurp-readme-header:end
  # What the opening comment says, after `begin`.
  notice: >-
    paste this block once, never again: the poster and the badges update themselves at each build
    of the site — do not edit it
  # Alt texts of the poster, of the status badge and of the two licence badges.
  posterAlt: zUrp Astronomics product poster
  statusAlt: status
  softwareAlt: software licence
  hardwareAlt: hardware licence
