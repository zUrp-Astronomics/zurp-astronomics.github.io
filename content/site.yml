# SOURCE: zurp-astronomics-site — the site's short texts: name, tagline, signature, titles, labels, alt texts
# AUTHOR: engineer
# DATE: 2026-10-06
# STATUS: active — read by src/lib/content.mjs (site pages, layout, components, social cards) and by scripts/readme-kit.mjs
# REVISED: 2026-10-06 (ticket #66) — `product.licenseOther`, the stamp of a licence GitHub does not recognise
# REVISED: 2026-10-06 (ticket #75) — `product.licenseOther` moved to licences.yml (`software.unrecognised`),
#   with the other texts of the two licences
# REVISED: 2026-10-12 (ticket #96) — `product.flash`: the « Flash » block of a product page, and the
#   name ESP Launchpad shows for a firmware
# REVISED: 2026-10-12 (ticket #101) — `product.flash` is gone with ESP Launchpad: `product.install`, the
#   #install block (ESP Web Tools button, .hex and .img.xz links with their notice)
# REVISED: 2026-10-20 (ticket #111) — `product.manual`: the tabs of a product's manual (their titles)
#
# Edit the texts freely: the code only places them. `{{product}}` / `{{basedOn}}` are markers the code
# fills (the product's name, its upstream project). Prose (several sentences) is in the .md files of
# content/, see content/README.md.

# The name, as everywhere: <title> of the home page, og:site_name, the footer's signature band, the
# signature drawn on the social preview cards (/brand/social/<slug>.jpg), the title of the org README.
name: zUrp Astronomics

# The tagline: home page (exhibition label), default meta description of every page, org README.
tagline: Low-tech, DIY, amateur astronomy hardware.

# Who owns us, written ONCE: the signature just below and the footer's product line (`productLine`)
# both take it through their `{{affiliation}}` marker.
affiliation: a subsidiary of zUrp Industries

# The signature: footer of the home page, foot of the org README. `{{name}}` / `{{affiliation}}` are
# the two texts above.
signature: '{{name}} — {{affiliation}}.'

# The organisation on GitHub: the « => GitHub » stamp, the footer link, the README kit.
org:
  url: https://github.com/zUrp-Astronomics
  handle: '@zUrp-Astronomics'

# The header of every page: the zUrp plate (a link to the home page) and the subtitle under it.
header:
  plateAlt: zUrp Astronomics
  homeLabel: zUrp Astronomics — home
  subtitle: Because buying is cheating.

# Home page.
home:
  posterAlt: >-
    Worn, creased poster reading “Low-Tech & DIY”: a riveted Nyan Cat trailing a pixel rainbow in
    front of a moon, on a blueprint with red rays.
  stampArrow: '=>'
  stampLabel: GitHub
  catalogTitle: Catalog
  manifestoTitle: Manifesto

# Product pages. The licence stamps are in licences.yml (ticket #75).
product:
  title: '{{product}} — zUrp Astronomics'
  basedOn: 'based on {{basedOn}}'
  aboutTitle: About
  sourceTitle: Source
  sourceArrow: ⟶
  # The manual of a product (ticket #111), on the page of a product whose repository writes one
  # (9_Assets/manual/): one tab per file, in this order, under these titles — the site's words, the
  # same on every page, never the product's. The Install block below is in the Setup tab. `label`
  # names the row of tabs for screen readers ({{product}}: the product's name).
  manual:
    label: '{{product}} manual'
    tabs:
      overview: Overview
      assembly: Assembly
      setup: Setup
      usage: Usage
  # The #install block (ticket #101), on the page of a product whose latest release carrying an
  # installable file (manifest.json, .hex, .img.xz) publishes one. `{{tag}}` is the tag of that
  # release (it may be older than the version stamp).
  install:
    title: Install
    version: 'Version {{tag}}'
    # ESP: the ESP Web Tools button, which finds the chip plugged in and picks its build. No text on
    # browsers here: when a browser cannot install, ESP Web Tools says so itself (the human's rule).
    esp:
      intro: Plug the board in over USB, then press the button.
      button: Install
    # The files linked where GitHub serves them, by kind, each list followed by its notice. `{{file}}`
    # is the file's name. What is proper to a product (where its SWD pads are…) is in its README.
    download: 'Download {{file}}'
    hex: >-
      STM32: connect an ST-Link to the board’s SWD pins, open the .hex in STM32CubeProgrammer, then
      press Download.
    img: >-
      Raspberry Pi: write the image to a microSD card with Raspberry Pi Imager (“Use custom”) or with
      Etcher.
    # The web bench (ticket #107), when the same release attaches one: a page that drives the board
    # over USB, speaking the firmware of that version. `button` opens it over the page, `tab` in a new
    # tab, `close` closes it; `frame` names it for screen readers ({{product}}: the product's name).
    bench:
      intro: Plug the board in over USB, then drive it from its bench, made for this version.
      button: Bench
      tab: Open in a new tab
      close: Close
      frame: '{{product}} bench'

# Footer of every page. `productLine` replaces the signature on a product page: `{{product}}` is the
# product's name, `{{name}}` / `{{affiliation}}` the texts at the top of this file.
footer:
  orgLabel: GitHub ·
  productLine: '{{product}} — a product of {{name}}, {{affiliation}}.'
  backToTop: Back to top
  panelAlt: >-
    Small worn, creased “Low-Tech & DIY” panel: a riveted Nyan Cat trailing a pixel rainbow in front
    of a moon, on a blueprint with red rays.
  panelTitle: Low-Tech & DIY — culture zUrp
